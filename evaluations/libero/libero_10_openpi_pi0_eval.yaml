defaults:
  - env/libero_10@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_openpi_pi0_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 2
    total_num_envs: 50
    auto_reset: False
    task_id_filter: [0]
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  safe_dump:
    enabled: true
    # Dumps land under <save_dir>/<task_id>/<run_id>/{success,fail}/, where
    # task_id is LIBERO's official task index (0..9 for libero_10).
    save_dir: "/mnt/public2/lizuojun/Codespace/RLinf/data/libero-RLinf-Pi0-LIBERO-Long-SFT"
    # Also store per-decision-step images (main/wrist/extra views) + robot state
    # alongside the hidden states, aligned per policy-inference step. Disable to
    # only keep hidden states + actions (smaller dumps).
    store_images: true
  safe_score:
    enabled: false
    detector: "indep"              # "indep" (MLP) or "lstm"
    ckpt_path: "/mnt/public2/lizuojun/Codespace/RLinf/data/checkpoints/safe/indep_mlp.ckpt"
    # Offline calibration rollouts used to recompute the functional-CP band at
    # runtime (any **/{success,fail}/*.pkl layout).
    calibration_data_path: "/mnt/public2/lizuojun/Codespace/RLinf/data"
    cp_band_alpha: 0.2
    # Seeds keep the runtime band reproducible (split_seed for seen/unseen +
    # train/val_seen; shuffle_seed for the functional-CP 30/70 split).
    unseen_task_ratio: 0.3
    seen_train_ratio: 0.6
    split_seed: 0
    shuffle_seed: 0
    # Feature pre-processing (must match SAFE pizero loader: mean over horizon
    # then mean over denoise steps).
    horizon_mean: true
    diff_mean: true
    model:
      # indep (MLP)
      name: "indep"
      n_layers: 2
      hidden_dim: 256
      n_history_steps: 1
      cumsum: true
      final_act_layer: "sigmoid"
      input_dim: 1024

  model:
    model_path: "/mnt/public2/lizuojun/Codespace/RLinf/data/checkpoints/RLinf-Pi0-LIBERO-Long-SFT" # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    model_type: "openpi"
    num_action_chunks: 10
    # action_dim: 12
    is_lora: False
    openpi:
      noise_level: 0.3
